spring.application.name=kakak_backend

spring.datasource.url=jdbc:postgresql://localhost:5432/kakak_backend
spring.datasource.username=postgres
spring.datasource.password=database123*
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

security.jwt.secret=${JWT_SECRET:change-this-secret-before-production}
security.jwt.access-expiration-seconds=900
security.jwt.refresh-expiration-seconds=604800
security.jwt.remember-me-refresh-expiration-seconds=2592000
